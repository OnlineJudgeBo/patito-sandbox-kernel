# Example: the judge next to an existing Patito database.
# /home/judge must hold etc/judge.conf and data/<problem_id>/<name>.in|.out, as with the previous judge.
services:
  patito-judge:
    build: .
    image: patito-sandbox-kernel:develop
    restart: always
    # isolate needs namespaces and its own control groups.
    privileged: true
    volumes:
      - ./judge-home:/home/judge
