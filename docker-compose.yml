services:
  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-patito}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-patito-local-only}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  isolate-wrapper:
    restart: always
    container_name: isolate-wrapper
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      sql-sandbox-db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - .env:/app/.env
    environment:
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-patito}:${RABBITMQ_PASSWORD:-patito-local-only}@rabbitmq:5672/"
      TESTCASES_PATH: "/app/test/testcases"
      MYSQL_SANDBOX_ADMIN_DSN: "root:${MYSQL_SANDBOX_ROOT_PASSWORD:-sandbox-local-only}@tcp(sql-sandbox-db:3306)/?timeout=5s&readTimeout=35s&writeTimeout=10s&charset=utf8mb4"
    networks:
      - default
      - sql-sandbox
    #working_dir: /app
    #command: go run src/cmd/listener/main.go
#
  callback-debug:
    image: mendhak/http-https-echo
    container_name: callback-debug
    ports:
      - "8085:8080"
    environment:
      - ECHO_METHOD=ALL
      - ECHO_HEADERS=true
      - ECHO_BODY=true
  sql-sandbox-db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_SANDBOX_ROOT_PASSWORD:-sandbox-local-only}"
    command:
      - --skip-log-bin
      - --local-infile=OFF
      - --secure-file-priv=NULL
      - --max-execution-time=30000
      - --max-connections=50
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - sql-sandbox
volumes:
  rabbitmq_data:

networks:
  sql-sandbox:
    internal: true
